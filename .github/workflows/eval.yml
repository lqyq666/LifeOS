name: Evaluation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptfoo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deterministic promptfoo gate self-check
        working-directory: evals/promptfoo
        run: npx -y promptfoo@0.124.1 eval -c ci.config.yaml --no-cache --no-progress-bar --no-table
